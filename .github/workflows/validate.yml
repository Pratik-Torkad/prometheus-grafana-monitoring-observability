name: Validate Monitoring Stack

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration-validation:
    name: Validate Prometheus, Alertmanager, Grafana and Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager configuration
        run: |
          docker run --rm \
            -v "$PWD/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint amtool prom/alertmanager:v0.34.2 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Grafana dashboard JSON
        run: python -m json.tool grafana/dashboards/docker-host-overview.json > /dev/null

      - name: Validate YAML files
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          candidates = [
              Path("docker-compose.yml"),
              Path("prometheus/prometheus.yml"),
              Path("prometheus/rules/alerts.yml"),
              Path("alertmanager/alertmanager.yml"),
              Path("grafana/provisioning/datasources/prometheus.yml"),
              Path("grafana/provisioning/dashboards/dashboard.yml"),
          ]
          for path in candidates:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"YAML OK: {path}")
          PY

      - name: Validate Docker Compose interpolation and structure
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env

  compose-smoke-test:
    name: Start and smoke-test the monitoring stack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Start monitoring services
        run: docker compose up -d

      - name: Wait for service APIs
        run: |
          set -eu
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/-/ready >/dev/null \
              && curl -fsS http://127.0.0.1:3000/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:9093/-/healthy >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs --no-color
              exit 1
            fi
            sleep 5
          done

      - name: Verify Prometheus scrape targets
        run: |
          set -eu
          curl -fsS http://127.0.0.1:9090/api/v1/targets \
            | jq -e '[.data.activeTargets[] | select(.health == "up")] | length == 4'

      - name: Verify Grafana provisioning
        run: |
          curl -fsS http://127.0.0.1:3000/api/datasources \
            -u "admin:ReplaceWithALongRandomPassword" \
            | jq -e 'any(.[]; .uid == "prometheus")'

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down monitoring stack
        if: always()
        run: |
          docker compose down -v
          rm -f .env
