global:
  resolve_timeout: 5m

route:
  receiver: local-only
  group_by:
    - alertname
    - job
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Alerts are visible in the Alertmanager UI. No external notification
  # credentials or endpoints are configured in this learning project.
  - name: local-only

inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal:
      - alertname
      - instance
